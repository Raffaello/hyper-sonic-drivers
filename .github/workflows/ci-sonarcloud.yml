### reusable workflow can't be called with a strategy matrix
### and so are not used as a workflow without a strategy matrix
### to feed in inputs parameters is useless in my case.

### Sonar cloud job the cache in $HOME/.sonar doesn't save sub-dirs
### so can't be cached.

name: ci-sonar
on:
  release:
    types: [created]
  push:
    branches:
      - master
  pull_request:
    #  branches: [ master ]
    paths-ignore:
      - "doc/**"
      - ".gitignore"
      - ".gitattributes"
      - "README.md"
      - "LICENSE"
      - "wave_generators.r"

jobs:
  sonarcloud:
    name: SonarCloud Analysis (x64-windows, Debug)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    env:
      SONAR_SCANNER_VERSION: 5.0.1.3006
      SONAR_SERVER_URL: "https://sonarcloud.io"
      BUILD_WRAPPER_OUT_DIR: build # Directory where build-wrapper output will be placed
      HOME: /c
      SONAR_DIR: C:/sonar
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: |
            base-devel mingw-w64-ucrt-x86_64-toolchain
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-munt-mt32emu
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            msys/unzip
            mingw-w64-ucrt-x86_64-python-lxml
            mingw-w64-ucrt-x86_64-python-pip
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21 # - uses: actions/checkout@v5
      #   with:
      #     fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: install gcovr
        run: pip install gcovr
      - name: create build dir
        run: mkdir build
      - uses: actions/cache@v4
        id: sonar-cache
        with:
          path: |
            # ${{ env.HOME }}/sonar
            ${{ env.SONAR_DIR}}
            # ${{ env.HOME }}/.sonar/sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}-windows
            # ${{ env.HOME }}/.sonar/build-wrapper-win-x86
          key: ${{ runner.os }}-sonar-cache-${{ env.SONAR_SCANNER_VERSION }}
          restore-keys: ${{ runner.os }}-sonar-cache
      - name: Download and set up sonar-scanner
        if: steps.sonar-cache.outputs.cache-hit != 'true'
        env:
          SONAR_SCANNER_DOWNLOAD_URL: https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${{ env.SONAR_SCANNER_VERSION }}-windows.zip
        run: |
          mkdir -p ${{ env.HOME }}/sonar
          curl -sSLo ${{ env.HOME }}/sonar/sonar-scanner.zip ${{ env.SONAR_SCANNER_DOWNLOAD_URL }}
          unzip -o ${{ env.HOME }}/sonar/sonar-scanner.zip -d ${{ env.HOME }}/sonar/
          rm ${{ env.HOME }}/sonar/sonar-scanner.zip
      - name: Download and set up build-wrapper
        if: steps.sonar-cache.outputs.cache-hit != 'true'
        env:
          BUILD_WRAPPER_DOWNLOAD_URL: ${{ env.SONAR_SERVER_URL }}/static/cpp/build-wrapper-win-x86.zip
        run: |
          curl -sSLo ${{ env.HOME }}/sonar/build-wrapper.zip ${{ env.BUILD_WRAPPER_DOWNLOAD_URL }}
          unzip -o ${{ env.HOME }}/sonar/build-wrapper.zip -d ${{ env.HOME }}/sonar/
          rm ${{ env.HOME }}/sonar/build-wrapper.zip
      - name: set up PATH
        run: |
          echo "${{ env.HOME }}/sonar/sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}-windows/bin" >> $GITHUB_PATH
          echo "${{ env.HOME }}/sonar/build-wrapper-win-x86" >> $GITHUB_PATH
      - name: cmake generator
        run: |
          cmake -G Ninja -DGENERATE_CODE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug ..
        working-directory: build
      - name: cmake build sonar wrapper
        run: |
          echo $PATH
          ${{ env.HOME }}/sonar/build-wrapper-win-x86/build-wrapper-win-x86-64 --out-dir . cmake --build . --config=Debug -j4
        working-directory: build
      - name: CTest (gcov)
        run: |
          # ctest --output-junit report.xml
          ctest -T test
        working-directory: build
      # - name: gcov gcno
      #   run: find . -name *.gcno -exec gcov --preserve-paths {} \;
      #   working-directory: build
      # - name: gcov gcda
      #   run: find . -name *.gcda -exec gcov --preserve-paths {} \;
      #   working-directory: build
      - name: generate gcovr report
        run: |
          gcovr --sonarqube coverage.xml
        working-directory: build
      - name: Run sonar-scanner
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # ls -l ${{ env.HOME }}/sonar
          # ls -l ${{ env.HOME }}/sonar/sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}-windows
          # ls -l ${{ env.HOME }}/sonar/sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}-windows/bin
          # ${{ env.HOME }}/sonar/sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}-windows/bin/sonar-scanner.bat --define sonar.host.url="${{ env.SONAR_SERVER_URL }}" --define sonar.cfamily.build-wrapper-output="${{ env.BUILD_WRAPPER_OUT_DIR }}"

          # echo "${{ env.SONAR_DIR }}\sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}-windows\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          ${{ env.SONAR_DIR }}/sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}-windows/bin/sonar-scanner.bat --define sonar.host.url="${{ env.SONAR_SERVER_URL }}" --define sonar.cfamily.build-wrapper-output="${{ env.BUILD_WRAPPER_OUT_DIR }}"
